<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23112e22'/><text x='50%' y='54%' dominant-baseline='central' text-anchor='middle' fill='%23f6f4ef' font-family='Georgia, serif' font-size='60'>A</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        {% if page.url contains 'notes' %}
          <a href="{{ '/' | relative_url }}">Articles</a>
        {% else %}
          <a href="{{ '/notes' | relative_url }}">Notes</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
  </div>
</body>
</html>
