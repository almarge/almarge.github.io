---
layout: default
---
<article class="post">
  <header class="post-header">
    {% if page.date %}
      <time class="post-meta">{{ page.date | date: "%d · %m · %Y" }}</time>
    {% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="post-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  
  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}" class="back-link">← Tornar a l'inici</a>
  </footer>
</article>
