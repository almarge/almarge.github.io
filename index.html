<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMARGE - Espai de Pensament Crític</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        
        <!-- Part superior: Linies vermelles i negres, texts -->
        <header class="top-bar">
            <div class="side-content">
                <span class="label">SOBRE</span>
            </div>
            <div class="center-lines">
                <div class="red-bar"></div>
                <div class="pattern"></div>
                <div class="red-bar"></div>
            </div>
            <div class="side-content">
                <span class="label">ESCRITS</span>
            </div>
        </header>

        <!-- Titular Gran -->
        <main class="main-content">
            <h1 class="main-title">ALMARGE</h1>
        </main>

        <!-- Part inferior: Graella de linies, rectangle vermell, dades i peu de pàgina -->
        <footer class="bottom-area">
            <div class="bottom-grid">
                <div class="info-block">
                    <p>ESPAI DE PENSAMENT CRÍTIC</p>
                </div>
                <div class="lines-pattern"></div>
                <div class="red-block"></div>
                <div class="lines-pattern"></div>
                <div class="meta-block">
                    <p class="date">MMXXV</p>
                    <p class="number">NÚM. 01</p>
                </div>
            </div>
            <p class="footer-tagline">AL MARGE DEL RELAT</p>
        </footer>

    </div>
</body>
</html>
