<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — almarge{% else %}almarge{% endif %}</title>
    <!-- Ruta al CSS de Jekyll -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <!-- Fonts de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="art-deco-frame">
        <main class="canvas">
            <header class="header-grid">
                <div class="header-left">
                    <a href="{{ '/' | relative_url }}" class="nav-link">SOBRE</a>
                </div>
                <div class="header-center-motif">
                    <div class="stripe-pattern"></div>
                    <div class="red-pillar-top"></div>
                    <div class="stripe-pattern"></div>
                </div>
                <div class="header-right">
                    <a href="{{ '/' | relative_url }}" class="nav-link">ESCRITS</a>
                </div>
            </header>

            <section class="content-container">
                {{ content }}
            </section>

            <footer class="footer-grid">
                <div class="footer-left">
                    <p class="tagline-box">FET<br>SENSE<br>PRESSA</p>
                </div>
                
                <div class="footer-center">
                    <div class="horizontal-stripes"></div>
                    <div class="red-block-bottom"></div>
                    <div class="horizontal-stripes"></div>
                </div>

                <div class="footer-right">
                    <span class="meta-date">MMXXVI</span>
                    <span class="meta-issue">NÚM. 01</span>
                </div>
            </footer>

            <div class="bottom-bar">
                <p class="sub-caption">AL MARGE DEL RELAT</p>
            </div>
        </main>
    </div>
</body>
</html>
